<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITRE}} — Les Typos de Thalie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Les Typos de Thalie</a>
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="catalogue.html" class="actif">Boutique</a></li>
                    <li><a href="contact.html">Contact & Commandes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="conteneur">
        <a href="catalogue.html" class="lien-retour">← Retour à la boutique</a>

        <div class="fiche-produit">
            <div class="galerie-produit">
                {{GALERIE}}
            </div>

            <div class="details-produit">
                <span class="badge-dispo {{CLASSE_DISPO}}">{{DISPONIBILITE}}</span>
                <h1>{{TITRE}}</h1>
                <p class="prix">{{PRIX}}</p>
                <div class="description">{{DESCRIPTION}}</div>
                {{BOUTON_ACTION}}
            </div>
        </div>
    </main>

    <footer>
        <p>Les Typos de Thalie — Linogravures artisanales faites main — <a href="contact.html" style="color: var(--vert-foret);">contact@lestyposdethalie.fr</a></p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
